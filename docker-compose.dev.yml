services:

  # ─────────────────────────────────────────
  # Postgres dev overrides
  # Expose port so you can connect from WSL
  # terminal, DBeaver, or any local DB tool
  # ─────────────────────────────────────────
  postgres:
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Extra logging in dev so you can see every query
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >
      postgres
      -c log_statement=all
      -c log_duration=on
      -c log_min_duration_statement=0

  # ─────────────────────────────────────────
  # Redis dev overrides
  # Expose port so you can inspect cache
  # with redis-cli from your WSL terminal
  # No memory limit in dev
  # ─────────────────────────────────────────
  redis:
    ports:
      - "6380:6379"

  # ─────────────────────────────────────────
  # pgAdmin — only in dev, never in prod
  # Visit http://localhost:5050
  # ─────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai_agent_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai_agent_network